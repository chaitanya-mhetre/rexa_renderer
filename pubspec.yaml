name: sdui_renderer
description: >-
  A server-driven UI (SDUI) SDK for Flutter. Render production-grade Flutter UIs from JSON published from your backend — no app store release needed.
version: 0.2.0
homepage: https://github.com/chaitanya-mhetre/sdui_renderer
repository: https://github.com/chaitanya-mhetre/sdui_renderer.git
issue_tracker: https://github.com/chaitanya-mhetre/sdui_renderer/issues
topics:
  - server-driven-ui
  - sdui
  - flutter
  - json
  - ui

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.9.0
  http: ^1.2.0
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  # No platform-specific assets needed for the SDK itself
